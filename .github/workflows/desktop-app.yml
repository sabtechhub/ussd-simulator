# Builds the desktop app for Windows and Mac and attaches it to a GitHub release.
# Runs when a release is published (or by hand from the Actions tab).
name: Desktop app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            file: desktop/dist/USSD-Simulator-Setup.exe
          - os: macos-latest
            script: dist:mac
            file: desktop/dist/USSD-Simulator-mac.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no code-signing certificate yet
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.file }}
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        working-directory: .
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.file }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
